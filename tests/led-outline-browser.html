<!doctype html><html lang="pt-BR"><meta charset="utf-8"><title>Teste de contornos LED</title>
<button id="test">Testar contorno fechado</button><p id="result">Aguardando teste.</p>
<script src="led-engine.js?v=20261028-2"></script><script src="led-svg.js?v=20261028-2"></script>
<script>
document.getElementById('test').onclick=async()=>{
 const result=document.getElementById('result');
 try{
  const src='<svg xmlns="http://www.w3.org/2000/svg" width="200mm" height="80mm" viewBox="0 0 200 80" fill-rule="evenodd"><style>.fil0{fill:none}.str0{stroke:#000;stroke-width:0.1}</style><path class="fil0 str0" d="M0 0H200V80H0Z M70 25H130V55H70Z"/></svg>';
  const parsed=LedSvg.parse(src),svg=parsed.node,w=400,h=160;svg.setAttribute('width',w);svg.setAttribute('height',h);
  const url=URL.createObjectURL(new Blob([new XMLSerializer().serializeToString(svg)],{type:'image/svg+xml'}));
  const img=new Image();try{await new Promise((ok,fail)=>{img.onload=ok;img.onerror=fail;img.src=url;});}finally{URL.revokeObjectURL(url);}
  const canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;const ctx=canvas.getContext('2d');ctx.drawImage(img,0,0);const rgba=ctx.getImageData(0,0,w,h).data,mask=new Uint8Array(w*h);for(let i=0;i<mask.length;i++)mask[i]=rgba[i*4+3]>127?1:0;
  const count=mask.reduce((a,b)=>a+b,0),hole=mask[80*w+200],layout=LedEngine.distribute({mask,w,h,sx:.5,sy:.5,widthMM:200,heightMM:80,length:30,width:8,gap:10,edge:5,rowGap:10,mode:'central',orientation:0});
  if(parsed.outlinesConverted!==1||count<1000||hole!==0||layout.modules.length<2)throw Error('Contorno, vazado ou distribuição incorretos');
  const mixed=LedSvg.parse('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 40"><rect x="0" y="0" width="40" height="40"/><rect x="60" y="0" width="40" height="40" fill="none" stroke="#000"/></svg>');
  if(mixed.outlinesConverted!==0)throw Error('Contorno decorativo alterado em desenho preenchido');
  result.textContent=`PASS: ${parsed.outlinesConverted} contorno convertido; ${layout.modules.length} módulos; vazado preservado; desenho misto preservado.`;
 }catch(error){result.textContent='FAIL: '+(error.message||error);}
};
</script></html>
